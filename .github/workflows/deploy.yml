name: MonsterASP Auto Deploy

on:
  push:
    branches:
      - main  # This triggers the update every time you push to the main branch

jobs:
  publish-and-ftp:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Ecomm_project_1/Ecomm_project_1.csproj

    - name: Publish Project
      # This compiles Ecomm_project_1 along with DataAccess, Models, and Utility
      run: dotnet publish Ecomm_project_1/Ecomm_project_1.csproj -c Release -o ./publish_output

    - name: Upload to MonsterASP via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish_output/
        server-dir: /wwwroot/